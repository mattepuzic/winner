<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UEFA Nations League Official</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(22, 30, 49, 0.75);
      --bg-input: #1a233a;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --accent-purple: #a855f7;
      --accent-green: #10b981;
      --text: #f8fafc;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding-bottom: 60px; min-height: 100vh; }

    header { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 20px; }
    .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #a855f7, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }

    .btn { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; transition: all 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-purple { background: linear-gradient(135deg, #a855f7, #7e22ce); }
    .btn-green { background: var(--accent-green); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; overflow-x: auto; }
    .tab-btn { padding: 10px 16px; background: transparent; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; border-radius: 8px; white-space: nowrap; }
    .tab-btn.active { background: var(--accent-purple); color: white; }

    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; color: #c084fc; display: flex; justify-content: space-between; align-items: center; }

    .groups-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { padding: 8px; text-align: center; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); }

    .match-item { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .score-input { width: 45px !important; text-align: center; font-weight: bold; padding: 4px; background: var(--bg-input); border: 1px solid var(--border); color: white; border-radius: 6px; }

    .bracket-flex { display: flex; gap: 20px; overflow-x: auto; padding: 10px 0; }
    .bracket-col { flex: 0 0 260px; }
    .bracket-card { background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }

    .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 15px; }
    .player-chip { background: var(--bg-input); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }

    .hidden { display: none !important; }
    .purple-text { color: var(--accent-purple); font-weight: bold; }
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <h1>🛡️ UEFA Nations League - Lega A</h1>
    <div>
      <button class="btn btn-purple" onclick="simulaTuttoGironi()">🎲 Simula Gironi</button>
      <a href="index.html" class="btn btn-outline" style="margin-left:8px;">⬅ Torna al Menu</a>
    </div>
  </div>
</header>

<div class="container">

  <div class="nav-tabs">
    <button class="tab-btn active" id="tb-gironi" onclick="switchTab('gironi')">⚽ Gironi Reali</button>
    <button class="tab-btn" id="tb-partite" onclick="switchTab('partite')">📅 Calendario Partite</button>
    <button class="tab-btn" id="tb-final8" onclick="switchTab('final8')">🏆 Quarti & Final Four</button>
    <button class="tab-btn" id="tb-rose" onclick="switchTab('rose')">👥 Rose Nazionali</button>
  </div>

  <div id="tab-gironi" class="tab-content">
    <div class="groups-grid" id="groups-container"></div>
  </div>

  <div id="tab-partite" class="tab-content hidden">
    <div class="card" id="fixtures-container"></div>
  </div>

  <div id="tab-final8" class="tab-content hidden">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
        <h3>🏆 Tabellone Final 8 (Quarti di Finale)</h3>
        <button class="btn btn-green btn-sm" onclick="generaFinal8()">⚡ Genera Quarti dalle 8 Qualificate</button>
      </div>
      <div class="bracket-flex" id="final8-tree"></div>
    </div>
  </div>

  <div id="tab-rose" class="tab-content hidden">
    <div class="card">
      <div class="card-title">Consultazione Rosa Selezionata</div>
      <select id="select-team" onchange="displayRoster(this.value)" style="width:100%; padding:12px; background:var(--bg-input); color:white; border:1px solid var(--border); border-radius:10px; margin-bottom:15px; font-weight:600;"></select>
      <div class="roster-grid" id="roster-container"></div>
    </div>
  </div>

</div>

<script>
  const LEAGUE_A_GROUPS = {
    "Girone A1": [
      { id: "POR", name: "Portogallo", flag: "🇵🇹" },
      { id: "CRO", name: "Croazia", flag: "🇭🇷" },
      { id: "SCO", name: "Scozia", flag: "🏴󠁧󠁢󠁳󠁣󠁴󠁿" },
      { id: "POL", name: "Polonia", flag: "🇵🇱" }
    ],
    "Girone A2": [
      { id: "FRA", name: "Francia", flag: "🇫🇷" },
      { id: "ITA", name: "Italia", flag: "🇮🇹" },
      { id: "BEL", name: "Belgio", flag: "🇧🇪" },
      { id: "ISR", name: "Israele", flag: "🇮🇱" }
    ],
    "Girone A3": [
      { id: "GER", name: "Germania", flag: "🇩🇪" },
      { id: "NED", name: "Paesi Bassi", flag: "🇳🇱" },
      { id: "HUN", name: "Ungheria", flag: "🇭🇺" },
      { id: "BIH", name: "Bosnia-Erzegovina", flag: "🇧🇦" }
    ],
    "Girone A4": [
      { id: "ESP", name: "Spagna", flag: "🇪🇸" },
      { id: "DEN", name: "Danimarca", flag: "🇩🇰" },
      { id: "SRB", name: "Serbia", flag: "🇷🇸" },
      { id: "SUI", name: "Svizzera", flag: "🇨🇭" }
    ]
  };

  let state = {};
  let final8Rounds = [];
  let playersDB = {};
  let rostersDB = {};

  async function init() {
    const ts = new Date().getTime();
    try {
      const r2 = await fetch('./data/players.json?v=' + ts); if(r2.ok) playersDB = await r2.json();
      const r3 = await fetch('./data/rosters.json?v=' + ts); if(r3.ok) rostersDB = await r3.json();
    } catch(e) {}

    Object.keys(LEAGUE_A_GROUPS).forEach(gName => {
      const teams = LEAGUE_A_GROUPS[gName].map(t => ({ ...t, P:0, W:0, D:0, L:0, GF:0, GA:0, GD:0, PTS:0 }));
      const matches = [];

      for(let a=0; a<teams.length; a++) {
        for(let b=a+1; b<teams.length; b++) {
          matches.push({ id: 'm_'+Math.random().toString(36).substr(2,5), home: teams[a], away: teams[b], homeScore: null, awayScore: null });
          matches.push({ id: 'm_'+Math.random().toString(36).substr(2,5), home: teams[b], away: teams[a], homeScore: null, awayScore: null });
        }
      }
      state[gName] = { teams, matches };
    });

    renderGironi();
    renderPartite();
    populateSelect();
  }

  function renderGironi() {
    const container = document.getElementById('groups-container');
    container.innerHTML = '';

    Object.keys(state).forEach(gName => {
      const g = state[gName];
      container.innerHTML += `
        <div class="card">
          <h3 style="color:#c084fc; margin-bottom:10px;">${gName}</h3>
          <table>
            <thead><tr><th style="text-align:left;">Squadra</th><th>G</th><th>DR</th><th>Pt</th></tr></thead>
            <tbody>
              ${g.teams.map((t, idx) => `
                <tr style="${idx < 2 ? 'background:rgba(168, 85, 247, 0.15); font-weight:bold;' : ''}">
                  <td style="text-align:left;">${t.flag} ${t.name}</td>
                  <td>${t.P}</td><td>${t.GD}</td><td class="purple-text">${t.PTS}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          <p style="font-size:0.75rem; color:var(--text-muted); margin-top:8px;">🟣 1ª e 2ª ai Quarti (Final 8)</p>
        </div>
      `;
    });
  }

  function renderPartite() {
    const container = document.getElementById('fixtures-container');
    container.innerHTML = '<div class="card-title">Calendario Incontri</div>';

    Object.keys(state).forEach(gName => {
      container.innerHTML += `<h4 style="color:#c084fc; margin:15px 0 10px 0;">${gName}</h4>`;
      state[gName].matches.forEach(m => {
        container.innerHTML += `
          <div class="match-item">
            <span style="font-weight:600;">${m.home.flag} ${m.home.name}</span>
            <div>
              <input type="number" class="score-input" value="${m.homeScore !== null ? m.homeScore : ''}" onchange="updateScore('${gName}', '${m.id}', true, this.value)">
              -
              <input type="number" class="score-input" value="${m.awayScore !== null ? m.awayScore : ''}" onchange="updateScore('${gName}', '${m.id}', false, this.value)">
            </div>
            <span style="font-weight:600;">${m.away.name} ${m.away.flag}</span>
          </div>
        `;
      });
    });
  }

  function updateScore(gName, matchId, isHome, val) {
    const match = state[gName].matches.find(m => m.id === matchId);
    const score = val === "" ? null : parseInt(val);
    if(isHome) match.homeScore = score; else match.awayScore = score;

    recalculate();
    renderGironi();
  }

  function recalculate() {
    Object.keys(state).forEach(gName => {
      const g = state[gName];
      g.teams.forEach(t => { t.P=0; t.W=0; t.D=0; t.L=0; t.GF=0; t.GA=0; t.GD=0; t.PTS=0; });

      g.matches.forEach(m => {
        if(m.homeScore !== null && m.awayScore !== null) {
          const home = g.teams.find(t => t.id === m.home.id);
          const away = g.teams.find(t => t.id === m.away.id);
          if(home && away) {
            home.P++; away.P++;
            home.GF += m.homeScore; home.GA += m.awayScore;
            away.GF += m.awayScore; away.GA += m.homeScore;
            home.GD = home.GF - home.GA; away.GD = away.GF - away.GA;

            if(m.homeScore > m.awayScore) { home.W++; away.L++; home.PTS += 3; }
            else if(m.awayScore > m.homeScore) { away.W++; home.L++; away.PTS += 3; }
            else { home.D++; away.D++; home.PTS += 1; away.PTS += 1; }
          }
        }
      });

      g.teams.sort((a,b) => b.PTS - a.PTS || b.GD - a.GD || b.GF - a.GF);
    });
  }

  function simulaTuttoGironi() {
    Object.keys(state).forEach(gName => {
      state[gName].matches.forEach(m => {
        m.homeScore = Math.floor(Math.random() * 4);
        m.awayScore = Math.floor(Math.random() * 3);
      });
    });
    recalculate();
    renderGironi();
    renderPartite();
  }

  function generaFinal8() {
    const qualified = [];
    Object.keys(state).forEach(gName => {
      qualified.push(state[gName].teams[0]);
      qualified.push(state[gName].teams[1]);
    });

    if(qualified.length < 8) { alert("Completa prima i gironi!"); return; }

    const qf = [
      { id: 'qf1', home: qualified[0], away: qualified[3], homeScore: null, awayScore: null },
      { id: 'qf2', home: qualified[2], away: qualified[1], homeScore: null, awayScore: null },
      { id: 'qf3', home: qualified[4], away: qualified[7], homeScore: null, awayScore: null },
      { id: 'qf4', home: qualified[6], away: qualified[5], homeScore: null, awayScore: null }
    ];

    const sf = [
      { id: 'sf1', home: { name: 'Vinc. QF1', flag: '❓' }, away: { name: 'Vinc. QF2', flag: '❓' }, homeScore: null, awayScore: null },
      { id: 'sf2', home: { name: 'Vinc. QF3', flag: '❓' }, away: { name: 'Vinc. QF4', flag: '❓' }, homeScore: null, awayScore: null }
    ];

    const fn = [
      { id: 'fn1', home: { name: 'Vinc. SF1', flag: '❓' }, away: { name: 'Vinc. SF2', flag: '❓' }, homeScore: null, awayScore: null }
    ];

    final8Rounds = [qf, sf, fn];
    renderFinal8();
  }

  function updateKnockoutScore(rIdx, mIdx, isHome, val) {
    const match = final8Rounds[rIdx][mIdx];
    const score = val === "" ? null : parseInt(val);
    if(isHome) match.homeScore = score; else match.awayScore = score;

    if(match.homeScore !== null && match.awayScore !== null) {
      let winner = match.homeScore > match.awayScore ? match.home : match.away;
      if(match.homeScore === match.awayScore) winner = Math.random() > 0.5 ? match.home : match.away;

      if(rIdx + 1 < final8Rounds.length) {
        const nextIdx = Math.floor(mIdx / 2);
        if(mIdx % 2 === 0) final8Rounds[rIdx + 1][nextIdx].home = winner;
        else final8Rounds[rIdx + 1][nextIdx].away = winner;
      }
    }
    renderFinal8();
  }

  function renderFinal8() {
    const container = document.getElementById('final8-tree');
    container.innerHTML = '';

    if(final8Rounds.length === 0) {
      container.innerHTML = '<p style="color:var(--text-muted);">Clicca su "Genera Quarti dalle 8 Qualificate" per comporre il tabellone.</p>';
      return;
    }

    const roundTitles = ["Quarti di Finale (Final 8)", "Semifinali", "Finale"];

    final8Rounds.forEach((round, rIdx) => {
      const col = document.createElement('div');
      col.className = 'bracket-col';
      col.innerHTML = `<h4 style="color:#60a5fa; margin-bottom:12px; text-align:center;">${roundTitles[rIdx]}</h4>`;

      round.forEach((m, mIdx) => {
        col.innerHTML += `
          <div class="bracket-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
              <span>${m.home.flag} ${m.home.name}</span>
              <input type="number" class="score-input" style="height:26px;" value="${m.homeScore !== null ? m.homeScore : ''}" onchange="updateKnockoutScore(${rIdx}, ${mIdx}, true, this.value)">
            </div>
            <div style="display:flex; justify-content:space-between;">
              <span>${m.away.flag} ${m.away.name}</span>
              <input type="number" class="score-input" style="height:26px;" value="${m.awayScore !== null ? m.awayScore : ''}" onchange="updateKnockoutScore(${rIdx}, ${mIdx}, false, this.value)">
            </div>
          </div>
        `;
      });
      container.appendChild(col);
    });
  }

  function populateSelect() {
    const sel = document.getElementById('select-team');
    const allTeams = [];
    Object.keys(LEAGUE_A_GROUPS).forEach(g => allTeams.push(...LEAGUE_A_GROUPS[g]));
    sel.innerHTML = allTeams.map(t => `<option value="${t.id}">${t.flag} ${t.name}</option>`).join('');
    if(allTeams.length > 0) displayRoster(allTeams[0].id);
  }

  function displayRoster(teamId) {
    const container = document.getElementById('roster-container');
    const key = Object.keys(rostersDB).find(k => k.toLowerCase() === teamId.toLowerCase());
    const squad = key ? rostersDB[key] : [];

    if(!squad || squad.length === 0) {
      container.innerHTML = '<p style="color:var(--text-muted); padding:10px;">Nessun giocatore registrato per questa squadra.</p>';
      return;
    }

    container.innerHTML = squad.map(pId => {
      const p = playersDB[pId] || { name: pId, pos: "GIOC" };
      return `
        <div class="player-chip">
          <span style="font-size:0.85rem; font-weight:600;">${p.name}</span>
          <span style="font-size:0.75rem; color:var(--accent-purple); font-weight:bold;">${p.pos}</span>
        </div>
      `;
    }).join('');
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${tabId}`).classList.remove('hidden');
    document.getElementById(`tb-${tabId}`).classList.add('active');
  }

  window.onload = init;
</script>
</body>
</html>
